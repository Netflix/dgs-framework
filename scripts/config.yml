# Currently Github Actions require us to explicitly clone the repository
# as part of the job steps. If we try to clone them as part of
# the Python scripts instead it will fail. Because of this, the list of examples
# is duplicated in the ./github/workflows/ci-beta.yml file.
# Each entry is a plain URI, or a mapping with "uri" and an optional "branch" (defaults to the remote's default
# branch). The branch must match the one used by the CI workflow (.github/workflows/ci.yml).
repositories:
    - uri: "git@github.com:Netflix/dgs-examples-java.git"
      branch: "boot4"
    - uri: "git@github.com:Netflix/dgs-examples-kotlin.git"
      branch: "boot4"
